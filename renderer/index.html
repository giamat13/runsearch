<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>runsearch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="search">
      <span class="glyph">&#xE094;</span>
      <div id="field">
        <div id="ghost" aria-hidden="true"></div>
        <input id="q" type="text" dir="auto" spellcheck="false" autocomplete="off" placeholder="Start typing..." aria-label="Query">
      </div>
    </div>
    <div id="results-wrap" hidden>
      <div class="divider"></div>
      <ul id="results" role="listbox"></ul>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
