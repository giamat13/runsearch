name: tests
# Runs on every push that changes more than docs, and is reused by the release workflow (workflow_call).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # the tests stub Electron, they never start it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
